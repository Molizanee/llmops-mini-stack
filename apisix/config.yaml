# APISIX standalone data plane — no etcd, no admin API, no dashboard.
# Routes/upstreams come from conf/apisix.yaml (config_provider: yaml).
#
# This file is OVERLAID on the image's built-in config-default.yaml, so only
# the deltas are listed. node_listen defaults to 9080.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  # SSE / streamable-http: stream upstream chunks straight through, no
  # buffering, long-lived reads. Raw nginx directives (http context) — OSS-safe
  # and avoids depending on the API7-hub proxy-buffering plugin. Because APISIX
  # only ever sees plain HTTP here (the tunnel terminates TLS), bug #12665
  # (SSE-over-HTTPS buffering) does not apply.
  http_configuration_snippet: |
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400s;
    chunked_transfer_encoding on;

# Replacing `plugins:` disables every plugin NOT listed. Only the ones the
# routes use (+ prometheus for metrics) are enabled.
plugins:
  - proxy-rewrite
  - cors
  - limit-count
  - limit-req
  - ip-restriction
  - prometheus

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
