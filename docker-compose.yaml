# Services:
#   - APISIX            (edge gateway)        -> :9080
#   - MCP Gateway       (OAuth shim + authz)  -> :9100
#   - LiteLLM Proxy     (LLM/MCP gateway)     -> :4000
#   - OpenFGA           (authorization)       -> :8080 / :8081
#   - Langfuse Web      (observability UI)    -> :3000
#   - Langfuse Worker   (async processing)
#   - Presidio Analyzer (PII detection)       -> :5002
#   - Presidio Anonymizer (PII masking)       -> :5001
#   - PostgreSQL        (shared OLTP)         -> :5432
#   - Postgres Init     (create langfuse/openfga DBs)
#   - ClickHouse        (Langfuse OLAP)       -> :8123
#   - Redis             (cache / queue)       -> :6379
#   - MinIO             (S3-compatible blob)  -> :9000 / :9090
#   - MinIO Init        (bucket creation)
#
# Edge → shim → control plane:
#   client → APISIX :9080 → mcp-gateway :9100 → LiteLLM :4000 → upstream MCPs
#   authn: cmp_* bearer → virtual key  |  authz: OpenFGA (team → mcp)
networks:
  llmops:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_AUTH}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9090"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: minio/mc:latest
    networks: [llmops]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${LANGFUSE_S3_EVENT_UPLOAD_BUCKET} --ignore-existing;
      mc mb myminio/${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET} --ignore-existing;
      exit 0;
      "
    restart: "no"

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB:-langfuse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-us-east-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:3000/api/public/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "3030:3030"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB:-langfuse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-us-east-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          memory: 1G

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "5002:3000"
    # Override the image entrypoint (gunicorn -w 1, no --timeout). --preload
    # loads the WSGI app in the master and forks workers from it, eliminating
    # the per-worker create_app() init hang that intermittently wedged a lone
    # sync worker (master logged "Using worker: sync" but never "Booting
    # worker", and /health never responded). --timeout reaps any worker that
    # still wedges so the arbiter respawns it.
    command: ["poetry", "run", "gunicorn", "--preload", "--workers", "1", "--timeout", "120", "--graceful-timeout", "30", "-b", "0.0.0.0:3000", "app:create_app()"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "5001:3000"
    # See presidio-analyzer note. 2 workers add redundancy (one wedged worker
    # can't down the service); --preload + --timeout handle the boot hang.
    command: ["poetry", "run", "gunicorn", "--preload", "--workers", "2", "--timeout", "120", "--graceful-timeout", "30", "-b", "0.0.0.0:3000", "app:create_app()"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  litellm:
    image: ghcr.io/berriai/litellm:v1.87.0
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REDIS_AUTH: ${REDIS_AUTH}
      # Upstream MCP OAuth credentials live HERE now (config.yaml mcp_servers
      # linear_mcp auth_type: oauth2), not in the gateway. Optional/blank ok.
      LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      # Public origin LiteLLM uses to build the MCP OAuth redirect_uri
      # (<PROXY_BASE_URL>/ui/mcp/oauth/callback). Set to the ngrok https URL
      # when exposing :4000 publicly for the native-OAuth Linear MCP test.
      PROXY_BASE_URL: ${PROXY_BASE_URL:-http://localhost:4000}
      # ngrok terminates TLS and forwards plain http to :4000; trust its
      # X-Forwarded-Proto so uvicorn reports https and the OAuth discovery
      # issuer/endpoints are emitted as https (LiteLLM issue #15719).
      FORWARDED_ALLOW_IPS: "*"
      # Allow external MCP OAuth clients (Claude) whose redirect_uri origin
      # differs from the proxy origin. Without this LiteLLM 400s the claude.ai
      # callback ("redirect_uri origin does not match the proxy origin").
      MCP_TRUSTED_REDIRECT_ORIGINS: ${MCP_TRUSTED_REDIRECT_ORIGINS:-claude.ai,claude.com}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "2"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  mcp-gateway:
    build: ./mcp-gateway
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "9100:9100"
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_healthy
      openfga:
        condition: service_healthy
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      # Required: resolves virtual key -> user email (the OpenFGA authz subject).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PUBLIC_BASE_URL: ${MCP_GATEWAY_PUBLIC_URL}
      ALLOWED_REDIRECT_PREFIXES: ${MCP_ALLOWED_REDIRECT_PREFIXES:-https://claude.ai/,https://claude.com/,http://localhost,http://127.0.0.1}
      REDIS_URL: redis://:${REDIS_AUTH}@redis:6379/2
      MCP_BEARER_TTL: ${MCP_BEARER_TTL:-2592000}
      # Authorization engine. Store/model ids resolved by name at startup.
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-llmops}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # Creates the langfuse + openfga databases on the shared Postgres instance
  # (POSTGRES_DB only creates litellm). Idempotent: skips existing DBs.
  postgres-init:
    image: postgres:16-alpine
    networks: [llmops]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      LANGFUSE_DB: ${LANGFUSE_DB:-langfuse}
      OPENFGA_DB: ${OPENFGA_DB:-openfga}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for db in "$${LANGFUSE_DB}" "$${OPENFGA_DB}"; do
          if psql -tc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1; then
            echo "postgres-init: db $$db exists"
          else
            createdb "$$db" && echo "postgres-init: created db $$db"
          fi
        done
        echo "postgres-init: done"
    restart: "no"

  # OpenFGA schema migration (one-shot). Creates tables; the openfga DB itself
  # must already exist (postgres-init).
  openfga-migrate:
    image: openfga/openfga:v1.8
    networks: [llmops]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${OPENFGA_DB:-openfga}?sslmode=disable
    command: migrate
    restart: "no"

  # OpenFGA authorization server (Zanzibar-style ReBAC). Source of truth for
  # which MCPs a team/user may access.
  openfga:
    image: openfga/openfga:v1.8
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "8080:8080"   # HTTP API (gateway calls /stores/{id}/check)
      - "8081:8081"   # gRPC (health probe)
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${OPENFGA_DB:-openfga}?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    command: run
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # One-shot: create store + upload model + seed example tuples via the HTTP API
  # (idempotent — skips if a store named OPENFGA_STORE_NAME already exists).
  openfga-bootstrap:
    image: curlimages/curl:latest
    networks: [llmops]
    depends_on:
      openfga:
        condition: service_healthy
    volumes:
      - ./openfga:/work:ro
    environment:
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-llmops}
    entrypoint: ["sh", "/work/bootstrap.sh"]
    restart: "no"

  # Edge gateway (standalone, HTTP only). A tunnel (ngrok/tailscale) terminates
  # TLS and forwards plain HTTP here — keeping the SSE hop on HTTP avoids APISIX
  # bug #12665. Point the public tunnel at this :9080, NOT mcp-gateway:9100.
  apisix:
    image: apache/apisix:3.13.0-debian
    restart: unless-stopped
    networks: [llmops]
    ports:
      - "9080:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      # Injected into apisix.yaml via ${{REDIS_AUTH}} for the limit-count plugin.
      REDIS_AUTH: ${REDIS_AUTH}
    depends_on:
      mcp-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The apisix:debian image ships no curl/wget; use openresty's resty for a
      # TCP liveness probe on the data-plane port.
      test: ["CMD", "resty", "-e", "local s=ngx.socket.tcp(); local ok=s:connect('127.0.0.1',9080); if not ok then os.exit(1) end; s:close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

