model_list:
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
  - model_name: minimax-m2.5
    litellm_params:
      model: openrouter/minimax/minimax-m2.5
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_AUTH

  drop_params: true

  default_internal_user_params:
    user_role: "internal_user"
    max_budget: 10.0
    budget_duration: "30d"
    models: ["gemini-3-flash", "minimax-m2.5"]
    tpm_limit: 10000
    rpm_limit: 60
    # nota: NÃO propaga para `allowed_routes` de keys geradas (no-op p/ key gen).
    # Só o `key_type` define routes da key. Para MCP, gere a key com key type
    # "Full Access" na UI (allowed_routes vazio). Ver docs/rbac-mcp.md §2.4.1.
    allowed_routes: ["llm_api_routes", "mcp_routes"]

  upperbound_key_generate_params:
    max_budget: 10.0
    budget_duration: "30d"
    duration: "30d"
    models: ["gemini-3-flash", "minimax-m2.5"]
    tpm_limit: 10000
    rpm_limit: 60

  mcp_aliases:
    "deepwiki": "deepwiki_mcp"
    "deep_wiki": "deepwiki_mcp"
    "linear": "linear_mcp"

mcp_servers:
  deepwiki_mcp:
    url: "https://mcp.deepwiki.com/mcp"
  linear_mcp:
    url: "https://mcp.linear.app/mcp"
    extra_headers: ["authorization"]

guardrails:
  - guardrail_name: "presidio-pii"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      output_parse_pii: true
      presidio_language: "en"
      presidio_filter_scope: both
      presidio_score_thresholds:
        ALL: 0.7
      pii_entities_config:
        PERSON: "MASK"
        CREDIT_CARD: "MASK"
        CRYPTO: "MASK"
        EMAIL_ADDRESS: "MASK"
        IBAN_CODE: "MASK"
        IP_ADDRESS: "MASK"
        LOCATION: "MASK"
        MEDICAL_LICENSE: "MASK"
        PHONE_NUMBER: "MASK"
        URL: "MASK"
        US_BANK_NUMBER: "MASK"
        US_DRIVER_LICENSE: "MASK"
        US_ITIN: "MASK"
        US_PASSPORT: "MASK"
        US_SSN: "MASK"
